name: Backend CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'bank-api/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'bank-api/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-ci:
    name: Validate Spring Boot Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bank-api

    steps:

      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar/configurar Java
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: bank-api/pom.xml

      # 3. Dar permisos al Maven Wrapper en Linux
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # 4. Ejecutar todo el ciclo de validación
      - name: Maven Clean Verify
        run: ./mvnw --batch-mode clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: bank-api/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            bank-api/target/surefire-reports/
            bank-api/target/failsafe-reports/
          if-no-files-found: warn
